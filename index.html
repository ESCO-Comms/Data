<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cabling Logbook</title>

<style>
:root {
  --bg-color: #ffffff;
  --text-color: #000000;
  --border-color: #ccc;
  --input-bg: #ffffff;
  --input-border: #ccc;
  --section-bg: #f9f9f9;
  --button-hover: #e8e8e8;
}

body.dark-mode {
  --bg-color: #1e1e1e;
  --text-color: #e0e0e0;
  --border-color: #444;
  --input-bg: #2d2d2d;
  --input-border: #444;
  --section-bg: #2d2d2d;
  --button-hover: #3d3d3d;
}

* {
  color: var(--text-color);
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
}

body {
  font-family: Arial, sans-serif;
  max-width: 800px;
  margin: auto;
  padding: 15px;
  background-color: var(--bg-color);
  transition: background-color 0.3s, color 0.3s;
  font-size: 16px;
}

h1, h2, h3 {
  margin: 15px 0 10px 0;
}

h2 {
  font-size: 24px;
}

h3 {
  font-size: 18px;
}

p {
  margin: 8px 0;
  font-size: 16px;
}

input, select, button {
  width: 100%;
  margin: 8px 0;
  padding: 14px;
  font-size: 16px;
  background-color: var(--input-bg);
  border: 2px solid var(--input-border);
  color: var(--text-color);
  border-radius: 6px;
  font-family: Arial, sans-serif;
}

button {
  cursor: pointer;
  transition: background-color 0.2s;
  font-weight: bold;
  min-height: 48px;
}

button:hover {
  background-color: var(--button-hover);
}

button:active {
  transform: scale(0.98);
}

input, select {
  box-sizing: border-box;
}

.entry {
  border: 2px solid var(--border-color);
  padding: 15px;
  margin-top: 12px;
  background-color: var(--section-bg);
  border-radius: 6px;
  font-size: 16px;
  line-height: 1.6;
}

.entry b {
  font-size: 17px;
  display: block;
  margin-bottom: 8px;
}

.entry-buttons {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.entry-buttons button {
  flex: 1;
  width: auto;
  margin: 0;
  padding: 12px;
  font-size: 14px;
  min-height: 44px;
}

.week-section {
  border: 3px solid var(--border-color);
  padding: 20px;
  margin-top: 20px;
  background-color: var(--section-bg);
  border-radius: 8px;
}

.week-header {
  background-color: #4CAF50;
  color: white;
  padding: 15px;
  border-radius: 6px;
  margin: -20px -20px 15px -20px;
  font-size: 18px;
  font-weight: bold;
}

.week-header.signed {
  background-color: #2196F3;
}

.week-header.unsigned {
  background-color: #ff9800;
}

.week-totals {
  display: flex;
  justify-content: space-around;
  padding: 12px 0;
  margin: 12px 0;
  border-top: 2px solid var(--border-color);
  border-bottom: 2px solid var(--border-color);
  flex-wrap: wrap;
}

.week-total-item {
  text-align: center;
  padding: 8px;
}

.week-total-item b {
  display: block;
  font-size: 20px;
  margin-top: 5px;
}

.supervisor-info {
  background-color: var(--input-bg);
  padding: 15px;
  border-radius: 6px;
  margin: 15px 0;
  border: 2px solid var(--border-color);
}

.supervisor-info.signed {
  border-color: #4CAF50;
  background-color: rgba(76, 175, 80, 0.1);
}

.supervisor-name {
  font-weight: bold;
  font-size: 16px;
}

.signature-display {
  border: 2px solid var(--border-color);
  padding: 10px;
  border-radius: 6px;
  text-align: center;
  margin: 10px 0;
}

.signature-display img {
  max-width: 100%;
  height: auto;
  max-height: 150px;
  border: 1px solid var(--border-color);
}

.sig-canvas {
  border: 2px solid var(--border-color);
  display: block;
  margin: 15px auto;
  touch-action: none;
  background: var(--input-bg);
  cursor: crosshair;
  width: 100%;
  max-width: 100%;
  height: 200px;
  border-radius: 6px;
}

.signature-section {
  overflow-x: hidden;
}

.signature-section {
  margin-top: 15px;
  padding: 15px;
  border: 2px solid var(--border-color);
  background: var(--section-bg);
  border-radius: 6px;
}

.button-group {
  display: flex;
  gap: 12px;
  margin: 15px 0;
}

.button-group button {
  flex: 1;
  width: auto;
  margin: 0;
  padding: 12px;
  min-height: 44px;
}

.header-controls {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.header-controls button {
  flex: 1;
  min-width: 100px;
  width: auto;
  margin: 0;
  padding: 12px;
  font-size: 14px;
  min-height: 44px;
}

.edit-modal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.5);
  overflow: auto;
  padding: 20px;
}

.edit-modal-content {
  background-color: var(--bg-color);
  margin: 20px auto;
  padding: 20px;
  border: 2px solid var(--border-color);
  width: 100%;
  max-width: 500px;
  border-radius: 6px;
}

.edit-modal-content input, .edit-modal-content select {
  margin: 12px 0;
  font-size: 16px;
}

.modal-buttons {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.modal-buttons button {
  flex: 1;
  width: auto;
  margin: 0;
  min-height: 44px;
}

.close {
  color: var(--text-color);
  float: right;
  font-size: 32px;
  font-weight: bold;
  cursor: pointer;
}

.close:hover {
  opacity: 0.7;
}

.status-message {
  padding: 15px;
  margin: 12px 0;
  border-radius: 6px;
  text-align: center;
  display: none;
  font-size: 16px;
  font-weight: bold;
}

.status-message.success {
  background-color: #4CAF50;
  color: white;
  display: block;
}

.status-message.error {
  background-color: #f44336;
  color: white;
  display: block;
}

hr {
  margin: 20px 0;
  border: none;
  border-top: 1px solid var(--border-color);
}

#total {
  font-size: 20px;
  font-weight: bold;
}

.week-selector {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}

.week-selector button {
  flex: 0 1 auto;
  min-width: 150px;
  padding: 10px;
  min-height: 40px;
}

.week-selector button.active {
  background-color: #4CAF50;
  color: white;
  font-weight: bold;
}

.info-box {
  background-color: #e3f2fd;
  border-left: 4px solid #2196F3;
  padding: 15px;
  margin: 15px 0;
  border-radius: 4px;
}

body.dark-mode .info-box {
  background-color: #1a3a52;
  border-left-color: #64b5f6;
}

.action-buttons {
  display: flex;
  gap: 12px;
  margin: 15px 0;
}

.action-buttons button {
  flex: 1;
  width: auto;
  margin: 0;
  padding: 12px;
  min-height: 44px;
  font-size: 14px;
}

.print-view {
  display: none;
  position: fixed;
  z-index: 1001;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: white;
  overflow: auto;
  padding: 30px;
}

.print-view.active {
  display: block;
}

.print-view-content {
  max-width: 600px;
  margin: 0 auto;
  font-family: Arial, sans-serif;
}

.print-view-header {
  text-align: center;
  margin-bottom: 30px;
  border-bottom: 2px solid #000;
  padding-bottom: 15px;
}

.print-view-header h2 {
  margin: 0 0 10px 0;
  font-size: 28px;
}

.print-week-header {
  background-color: #f0f0f0;
  padding: 12px;
  margin: 20px 0 12px 0;
  border-left: 4px solid #2196F3;
  font-weight: bold;
  font-size: 15px;
  page-break-inside: avoid;
}

.print-week-summary {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 12px;
  background-color: #f9f9f9;
  border: 1px solid #ddd;
  border-radius: 4px;
  margin-bottom: 15px;
  font-size: 13px;
  page-break-inside: avoid;
}

.print-summary-item {
  display: flex;
  justify-content: space-between;
}

.print-summary-label {
  font-weight: bold;
  color: #333;
}

.print-summary-value {
  color: #2196F3;
  font-weight: 600;
}

.print-week-total {
  text-align: right;
  font-size: 16px;
  font-weight: bold;
  margin: 12px 0;
  padding: 12px 0;
  border-top: 2px solid #000;
  border-bottom: 1px solid #ccc;
}

.print-supervisor-info {
  background-color: #f9f9f9;
  padding: 12px;
  margin: 12px 0;
  border-left: 4px solid #4CAF50;
  font-size: 12px;
  page-break-inside: avoid;
  line-height: 1.5;
}

.print-supervisor-sig {
  margin-top: 8px;
  text-align: center;
  border-top: 1px solid #ccc;
  padding-top: 8px;
}

.print-supervisor-sig img {
  max-width: 150px;
  height: auto;
  border: 1px solid #ccc;
  padding: 3px;
}

.print-grand-total {
  text-align: right;
  font-size: 18px;
  font-weight: bold;
  margin-top: 20px;
  padding: 15px 0;
  border-top: 3px solid #000;
  border-bottom: 3px solid #000;
}

.print-controls {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}

.print-controls button {
  flex: 1;
  width: auto;
  margin: 0;
  padding: 12px;
  min-height: 44px;
  font-size: 14px;
  cursor: pointer;
  background-color: #4CAF50;
  color: white;
  border: none;
  border-radius: 6px;
  font-weight: bold;
}

.print-controls button:hover {
  background-color: #45a049;
}

.print-controls button.close-btn {
  background-color: #f44336;
}

.print-controls button.close-btn:hover {
  background-color: #da190b;
}

@media print {
  body {
    padding: 0;
  }
  .header-controls, .info-box, .week-selector, .signature-section, .action-buttons, .entry-buttons, #addBtn, .print-controls {
    display: none !important;
  }
  .week-section {
    page-break-inside: avoid;
    border: none;
    padding: 0;
    margin: 0;
  }
  .print-view {
    position: static;
    padding: 0;
  }
}

/* Tablet and up */
@media (min-width: 768px) {
  body {
    padding: 30px;
    font-size: 16px;
  }
  
  .header-controls button {
    min-width: auto;
  }
  
  .sig-canvas {
    height: 150px;
    max-width: 400px;
  }
  
  .week-selector button {
    min-width: 140px;
  }
}

/* Landscape phone optimization */
@media (max-height: 500px) {
  .header-controls {
    margin-bottom: 8px;
  }
  
  .entry {
    padding: 12px;
    margin-top: 8px;
  }
  
  input, select, button {
    margin: 6px 0;
    padding: 10px;
  }
}
</style>
</head>

<body>

<div class="header-controls">
  <button id="darkModeBtn" type="button">🌙 Dark</button>
  <button id="exportBtn" type="button">📥 Export CSV</button>
  <button id="sendDataBtn" type="button">💾 Save Backup</button>
  <button id="printReportBtn" type="button">📋 Print Report</button>
  <button id="resetBtn" type="button">🔄 Reset</button>
</div>

<h2>Cabling Logbook</h2>

<div id="statusMsg" class="status-message"></div>

<div class="info-box">
  <strong>📝 How it works:</strong> Add entries below, they'll be grouped by week. Each week can have a different supervisor sign-off. Use "Save Backup" to save all your data as a file on your device.
</div>

<!-- Details -->
<input id="name" placeholder="Your Name" type="text">
<input id="employer" placeholder="Employer" type="text">

<hr>

<!-- Add Entry Form -->
<h3>Add New Entry</h3>
<input id="date" type="date">
<input id="job" placeholder="Job" type="text">
<input id="work" placeholder="Work" type="text">
<input id="hours" type="number" placeholder="Hours" step="0.5" min="0">

<select id="cable">
  <option>Cat5e</option>
  <option>Cat6</option>
  <option>Cat6A</option>
</select>

<select id="task">
  <option>Cable Installation</option>
  <option>Terminate Outlets Field</option>
  <option>Terminate Outlets Rack</option>
  <option>Patching</option>
  <option>Testing/Certifying</option>
</select>

<button id="addBtn" type="button">➕ Add Entry</button>

<h3>Total Hours: <span id="total">0</span></h3>

<!-- Week Selector -->
<div id="weekSelector" class="week-selector"></div>

<!-- Weekly Entries Display -->
<div id="weeksList"></div>

<!-- PRINT VIEW MODAL -->
<div id="printView" class="print-view">
  <div class="print-view-content">
    <div class="print-controls">
      <button onclick="window.print()" type="button">🖨️ Print</button>
      <button class="close-btn" onclick="closePrintView()" type="button">❌ Close</button>
    </div>
    <div id="printContent"></div>
  </div>
</div>

<!-- EDIT MODAL -->
<div id="editModal" class="edit-modal">
  <div class="edit-modal-content">
    <span class="close">&times;</span>
    <h3>Edit Entry</h3>
    <input id="editDate" type="date">
    <input id="editJob" placeholder="Job" type="text">
    <input id="editWork" placeholder="Work" type="text">
    <input id="editHours" type="number" placeholder="Hours" step="0.5" min="0">
    <select id="editCable">
      <option>Cat5e</option>
      <option>Cat6</option>
      <option>Cat6A</option>
    </select>
    <select id="editTask">
      <option>Cable Installation</option>
      <option>Terminate Outlets Field</option>
      <option>Terminate Outlets Rack</option>
      <option>Patching</option>
      <option>Testing/Certifying</option>
    </select>
    <div class="modal-buttons">
      <button id="saveEditBtn" type="button">✅ Save</button>
      <button id="cancelEditBtn" type="button">❌ Cancel</button>
    </div>
  </div>
</div>

<script>

// ✅ LOAD SAVED DATA
let entries = JSON.parse(localStorage.getItem("logbook")) || [];
let weeklySignatures = JSON.parse(localStorage.getItem("weeklySignatures")) || {};
let editingIndex = -1;
let currentWeek = null;

// ✅ DARK MODE
document.getElementById("darkModeBtn").onclick = function () {
  document.body.classList.toggle("dark-mode");
  localStorage.setItem("darkMode", document.body.classList.contains("dark-mode"));
};

// ✅ GET WEEK STARTING DATE
function getWeekStart(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day;
  d.setDate(diff);
  d.setHours(0, 0, 0, 0);
  return d.toISOString().split("T")[0];
}

// ✅ GET WEEK ENDING DATE
function getWeekEnd(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + 6;
  d.setDate(diff);
  d.setHours(23, 59, 59, 999);
  return d.toISOString().split("T")[0];
}

// ✅ GET ALL WEEKS WITH ENTRIES
function getAllWeeks() {
  const weeks = {};
  entries.forEach(e => {
    const weekStart = getWeekStart(e.date);
    if (!weeks[weekStart]) {
      weeks[weekStart] = [];
    }
    weeks[weekStart].push(e);
  });
  return Object.keys(weeks).sort().reverse();
}

// ✅ GET ENTRIES FOR WEEK
function getWeekEntries(weekStart) {
  return entries.filter(e => getWeekStart(e.date) === weekStart);
}

// ✅ AGGREGATE WEEK DATA BY TASK AND CABLE TYPE
function getWeekSummary(weekStart) {
  const weekEntries = getWeekEntries(weekStart);
  const taskTotals = {};
  const cableTotals = {};
  let weekTotal = 0;

  weekEntries.forEach(e => {
    // Aggregate by task
    if (!taskTotals[e.task]) {
      taskTotals[e.task] = 0;
    }
    taskTotals[e.task] += e.hours;

    // Aggregate by cable type
    if (!cableTotals[e.cable]) {
      cableTotals[e.cable] = 0;
    }
    cableTotals[e.cable] += e.hours;

    weekTotal += e.hours;
  });

  return { taskTotals, cableTotals, weekTotal, entryCount: weekEntries.length };
}

// ✅ SHOW STATUS MESSAGE
function showStatus(message, type) {
  const msg = document.getElementById("statusMsg");
  msg.innerText = message;
  msg.className = `status-message ${type}`;
  setTimeout(() => {
    msg.className = "status-message";
  }, 3000);
}

// ✅ EXPORT CSV
document.getElementById("exportBtn").onclick = function () {
  if (entries.length === 0) {
    showStatus("No entries to export", "error");
    return;
  }

  let csv = "Date,Job,Work,Cable,Task,Hours,Week Supervisor,Licence Number\n";
  entries.forEach(e => {
    const weekStart = getWeekStart(e.date);
    const sigData = weeklySignatures[weekStart] || {};
    csv += `"${e.date}","${e.job}","${e.work}","${e.cable}","${e.task}",${e.hours},"${sigData.supervisorName || ''}","${sigData.licenceNumber || ''}"\n`;
  });

  const link = document.createElement("a");
  link.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
  link.download = "logbook_export_" + new Date().toISOString().split("T")[0] + ".csv";
  link.click();
  
  showStatus("CSV exported successfully", "success");
};

// ✅ SAVE DATA AS JSON FILE (Works on iPhone, Android, Desktop)
document.getElementById("sendDataBtn").onclick = function () {
  if (entries.length === 0) {
    showStatus("No entries to backup", "error");
    return;
  }

  const backupData = {
    employee_name: document.getElementById("name").value || "Not Provided",
    employer: document.getElementById("employer").value || "Not Provided",
    backup_date: new Date().toLocaleString(),
    total_entries: entries.length,
    total_hours: entries.reduce((sum, e) => sum + e.hours, 0),
    entries: entries,
    signatures: weeklySignatures
  };

  // Convert to JSON string with nice formatting
  const jsonString = JSON.stringify(backupData, null, 2);
  
  // Create a Blob from the JSON string
  const blob = new Blob([jsonString], { type: "application/json" });
  
  // Create download link
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "logbook_backup_" + new Date().toISOString().split("T")[0] + ".json";
  
  // Trigger download
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  
  // Clean up the URL object
  URL.revokeObjectURL(url);
  
  showStatus("✅ Backup saved! Check your device's Downloads folder.", "success");
};

// ✅ PRINT FULL REPORT WITH ALL WEEKS (CONDENSED)
document.getElementById("printReportBtn").onclick = function () {
  if (entries.length === 0) {
    showStatus("No entries to print", "error");
    return;
  }
  
  openPrintView();
};

// ✅ CLOSE PRINT VIEW
function closePrintView() {
  document.getElementById("printView").classList.remove("active");
}

// ✅ OPEN PRINT VIEW WITH CONDENSED WEEK SUMMARIES
function openPrintView() {
  const printContent = document.getElementById("printContent");
  const allWeeks = getAllWeeks();
  
  let html = `
    <div class="print-view-header">
      <h2>Cabling Logbook Report</h2>
      <p>Employee: ${document.getElementById("name").value || "N/A"}</p>
      <p>Employer: ${document.getElementById("employer").value || "N/A"}</p>
      <p>Report Generated: ${new Date().toLocaleDateString()}</p>
    </div>
  `;
  
  let grandTotal = 0;
  
  allWeeks.forEach(weekStart => {
    const weekEnd = getWeekEnd(weekStart);
    const summary = getWeekSummary(weekStart);
    const sigData = weeklySignatures[weekStart] || {};
    
    grandTotal += summary.weekTotal;
    
    // Week header with date range
    html += `<div class="print-week-header">Week: ${weekStart} to ${weekEnd} (${summary.entryCount} entries)</div>`;
    
    // Week summary grid
    html += `<div class="print-week-summary">`;
    
    // Task breakdown
    Object.entries(summary.taskTotals).forEach(([task, hours]) => {
      html += `
        <div class="print-summary-item">
          <span class="print-summary-label">${task}:</span>
          <span class="print-summary-value">${hours} hrs</span>
        </div>
      `;
    });
    
    // Cable type breakdown
    Object.entries(summary.cableTotals).forEach(([cable, hours]) => {
      html += `
        <div class="print-summary-item">
          <span class="print-summary-label">${cable}:</span>
          <span class="print-summary-value">${hours} hrs</span>
        </div>
      `;
    });
    
    html += `</div>`;
    
    // Week total
    html += `<div class="print-week-total">Week Total: ${summary.weekTotal} hours</div>`;
    
    // Add supervisor signature info if available
    if (sigData.supervisorName) {
      html += `
        <div class="print-supervisor-info">
          <strong>✅ Signed Off</strong><br>
          <strong>Supervisor:</strong> ${sigData.supervisorName}<br>
          <strong>Licence Number:</strong> ${sigData.licenceNumber}<br>
          <strong>Date Signed:</strong> ${new Date(sigData.date).toLocaleDateString()}
      `;
      if (sigData.signature) {
        html += `
          <div class="print-supervisor-sig">
            <img src="${sigData.signature}" alt="Supervisor Signature">
          </div>
        `;
      }
      html += `</div>`;
    }
  });
  
  html += `<div class="print-grand-total">TOTAL HOURS: ${grandTotal}</div>`;
  
  printContent.innerHTML = html;
  document.getElementById("printView").classList.add("active");
}

// ✅ RESET ALL DATA
document.getElementById("resetBtn").onclick = function () {
  if (confirm("⚠️ ARE YOU SURE? This will delete ALL entries and signatures. This cannot be undone!")) {
    if (confirm("Last chance to cancel. Delete EVERYTHING?")) {
      entries = [];
      weeklySignatures = {};
      localStorage.removeItem("logbook");
      localStorage.removeItem("weeklySignatures");
      render();
      showStatus("All data cleared", "success");
    }
  }
};

// ✅ EDIT MODAL
const editModal = document.getElementById("editModal");
const closeBtn = document.querySelector(".close");

closeBtn.onclick = function () {
  editModal.style.display = "none";
};

window.onclick = function (event) {
  if (event.target == editModal) {
    editModal.style.display = "none";
  }
};

// ✅ OPEN EDIT MODAL
function openEditModal(index) {
  editingIndex = index;
  const e = entries[index];
  
  document.getElementById("editDate").value = e.date;
  document.getElementById("editJob").value = e.job;
  document.getElementById("editWork").value = e.work;
  document.getElementById("editHours").value = e.hours;
  document.getElementById("editCable").value = e.cable;
  document.getElementById("editTask").value = e.task;
  
  editModal.style.display = "block";
}

// ✅ SAVE EDIT
document.getElementById("saveEditBtn").onclick = function () {
  const date = document.getElementById("editDate").value;
  const job = document.getElementById("editJob").value;
  const work = document.getElementById("editWork").value;
  const cable = document.getElementById("editCable").value;
  const task = document.getElementById("editTask").value;
  const hours = parseFloat(document.getElementById("editHours").value);

  if (!hours || hours <= 0) {
    showStatus("Enter valid hours", "error");
    return;
  }

  entries[editingIndex] = { date, job, work, cable, task, hours };
  saveData();
  render();
  editModal.style.display = "none";
  showStatus("Entry updated", "success");
};

document.getElementById("cancelEditBtn").onclick = function () {
  editModal.style.display = "none";
};

// ✅ ADD ENTRY
document.getElementById("addBtn").onclick = function () {
  const date = document.getElementById("date").value;
  const job = document.getElementById("job").value;
  const work = document.getElementById("work").value;
  const cable = document.getElementById("cable").value;
  const task = document.getElementById("task").value;
  const hours = parseFloat(document.getElementById("hours").value);

  if (!date || !hours || hours <= 0) {
    showStatus("Fill in all fields properly", "error");
    return;
  }

  entries.push({ date, job, work, cable, task, hours });
  
  // Save name and employer
  localStorage.setItem("userName", document.getElementById("name").value);
  localStorage.setItem("employer", document.getElementById("employer").value);
  
  saveData();
  render();

  // Clear form
  document.getElementById("date").value = new Date().toISOString().split("T")[0];
  document.getElementById("job").value = "";
  document.getElementById("work").value = "";
  document.getElementById("hours").value = "";
  
  showStatus("Entry added", "success");
};

// ✅ SAVE TO LOCAL STORAGE
function saveData() {
  localStorage.setItem("logbook", JSON.stringify(entries));
  localStorage.setItem("weeklySignatures", JSON.stringify(weeklySignatures));
}

// ✅ RENDER UI
function render() {
  // Update total hours
  const total = entries.reduce((sum, e) => sum + e.hours, 0);
  document.getElementById("total").innerText = total.toFixed(1);

  // Get all weeks and render them
  const allWeeks = getAllWeeks();
  const weeksList = document.getElementById("weeksList");
  const weekSelector = document.getElementById("weekSelector");
  
  weeksList.innerHTML = "";
  weekSelector.innerHTML = "";

  if (allWeeks.length === 0) {
    weeksList.innerHTML = "<p>No entries yet. Add one above!</p>";
    return;
  }

  allWeeks.forEach(weekStart => {
    const weekEnd = getWeekEnd(weekStart);
    const weekEntries = getWeekEntries(weekStart);
    const summary = getWeekSummary(weekStart);
    const sigData = weeklySignatures[weekStart] || {};
    
    // Week selector button
    const btn = document.createElement("button");
    btn.innerText = weekStart;
    btn.onclick = () => {
      currentWeek = weekStart;
      render();
    };
    if (currentWeek === weekStart) {
      btn.classList.add("active");
    }
    weekSelector.appendChild(btn);

    // Week section
    const weekDiv = document.createElement("div");
    weekDiv.className = "week-section";
    
    const headerClass = sigData.supervisorName ? "week-header signed" : "week-header unsigned";
    const headerText = sigData.supervisorName ? "✅ SIGNED OFF" : "⚠️ NOT SIGNED";
    weekDiv.innerHTML = `<div class="${headerClass}">${headerText}: ${weekStart} to ${weekEnd}</div>`;

    // Show detailed entries if this week is selected
    if (currentWeek === weekStart) {
      weekEntries.forEach((entry, index) => {
        const globalIndex = entries.indexOf(entry);
        const entryDiv = document.createElement("div");
        entryDiv.className = "entry";
        entryDiv.innerHTML = `
          <b>${entry.date}: ${entry.job}</b>
          <strong>Task:</strong> ${entry.task}<br>
          <strong>Cable:</strong> ${entry.cable}<br>
          <strong>Work:</strong> ${entry.work}<br>
          <strong>Hours:</strong> ${entry.hours}
          <div class="entry-buttons">
            <button onclick="openEditModal(${globalIndex})" type="button">✏️ Edit</button>
            <button onclick="deleteEntry(${globalIndex})" type="button">🗑️ Delete</button>
          </div>
        `;
        weekDiv.appendChild(entryDiv);
      });
    }

    // Week totals
    const totalsDiv = document.createElement("div");
    totalsDiv.className = "week-totals";
    totalsDiv.innerHTML = `
      <div class="week-total-item"><strong>Total Hours:</strong><b>${summary.weekTotal}</b></div>
      <div class="week-total-item"><strong>Entries:</strong><b>${summary.entryCount}</b></div>
    `;
    weekDiv.appendChild(totalsDiv);

    // Supervisor info section
    const supDiv = document.createElement("div");
    supDiv.className = `supervisor-info ${sigData.supervisorName ? 'signed' : ''}`;
    
    if (sigData.supervisorName) {
      supDiv.innerHTML = `
        <div class="supervisor-name">Supervisor: ${sigData.supervisorName}</div>
        <strong>Licence Number:</strong> ${sigData.licenceNumber}<br>
        <strong>Date Signed:</strong> ${new Date(sigData.date).toLocaleDateString()}<br>
      `;
      if (sigData.signature) {
        const sigDisplay = document.createElement("div");
        sigDisplay.className = "signature-display";
        sigDisplay.innerHTML = `<img src="${sigData.signature}" alt="Signature">`;
        supDiv.appendChild(sigDisplay);
      }
    } else {
      supDiv.innerHTML = "<p>No supervisor sign-off yet</p>";
    }

    weekDiv.appendChild(supDiv);

    // Add week-specific buttons
    if (currentWeek === weekStart) {
      const buttonDiv = document.createElement("div");
      buttonDiv.className = "button-group";
      buttonDiv.innerHTML = `
        <button onclick="startSupervisorSignoff('${weekStart}')" type="button">👨‍💼 Supervisor Sign-Off</button>
        <button onclick="closeWeek('${weekStart}')" type="button">🔒 Close Week</button>
      `;
      weekDiv.appendChild(buttonDiv);
    }

    weeksList.appendChild(weekDiv);
  });
}

// ✅ DELETE ENTRY
function deleteEntry(index) {
  if (confirm("Delete this entry?")) {
    entries.splice(index, 1);
    saveData();
    render();
    showStatus("Entry deleted", "success");
  }
}

// ✅ SUPERVISOR SIGN-OFF
function startSupervisorSignoff(weekStart) {
  alert("📱 Supervisor sign-off feature - implement with signature pad or form");
}

function closeWeek(weekStart) {
  alert("🔒 Week is now locked for further edits");
}

// ✅ AUTO DATE & LOAD NAME AND EMPLOYER
window.onload = function () {
  if (localStorage.getItem("darkMode") === "true") {
    document.body.classList.add("dark-mode");
  }

  let today = new Date().toISOString().split("T")[0];
  document.getElementById("date").value = today;
  
  // ✅ LOAD NAME FROM STORAGE
  let savedName = localStorage.getItem("userName");
  if (savedName) {
    document.getElementById("name").value = savedName;
  }
  
  // ✅ LOAD EMPLOYER FROM STORAGE
  let savedEmployer = localStorage.getItem("employer");
  if (savedEmployer) {
    document.getElementById("employer").value = savedEmployer;
  }
  
  currentWeek = getWeekStart(today);
  render();
};

</script>
